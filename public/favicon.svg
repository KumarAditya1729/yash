<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F3D2E" />
      <stop offset="100%" stop-color="#0A2A20" />
    </linearGradient>

    <!-- Gold Gradients -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DFB8" />
      <stop offset="35%" stop-color="#D4B679" />
      <stop offset="70%" stop-color="#BA9554" />
      <stop offset="100%" stop-color="#DFBF82" />
    </linearGradient>

    <linearGradient id="gold-bright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D6" />
      <stop offset="50%" stop-color="#E2C284" />
      <stop offset="100%" stop-color="#B88F46" />
    </linearGradient>

    <!-- Leaf Gradients -->
    <linearGradient id="leaf-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A6349" />
      <stop offset="50%" stop-color="#588562" />
      <stop offset="100%" stop-color="#7EA677" />
    </linearGradient>
    <linearGradient id="leaf-shadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#234633" />
      <stop offset="100%" stop-color="#466F52" />
    </linearGradient>
  </defs>

  <!-- Squircle Rounded Container -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg-grad)" />
  
  <!-- Subtle inner border for luxury finish -->
  <rect x="12" y="12" width="488" height="488" rx="100" ry="100" fill="none" stroke="#C9A96B" stroke-width="2" stroke-opacity="0.25" />

  <g transform="translate(256, 256) scale(1.65) translate(-120, -115)">
    <!-- Standalone Emblem in Dark/Icon Mode: Letter A is White -->
    <!-- RIGHT STEM OF 'A' (Crisp White with elegant calligraphic tapering) -->
    <path d="M 116 16 L 126 50 L 175 168 L 196 172 L 196 176 L 140 176 L 140 172 L 154 168 L 125 96 L 115 54 Z" 
          fill="#FFFFFF" />
          
    <!-- LEFT APEX OF 'A' -->
    <path d="M 116 16 L 115 54 L 92 98 L 76 86 Z" 
          fill="#FFFFFF" />

    <!-- THE LEAF (Nature - Left flourish of the 'A') -->
    <!-- Left Leaf Shading (Darker side) -->
    <path d="M 52 148 C 38 126 42 100 58 78 C 66 68 76 60 84 56 C 81 74 74 95 62 116 C 54 130 52 142 52 148 Z" 
          fill="url(#leaf-shadow)" />
    <!-- Right Leaf Shading (Bright foliage side) -->
    <path d="M 84 56 C 88 72 88 92 81 114 C 74 134 62 148 52 148 C 58 134 66 112 72 90 C 78 72 82 58 84 56 Z" 
          fill="url(#leaf-grad)" />
    <!-- Leaf central spine rib -->
    <path d="M 84 56 C 80 82 70 114 52 148" 
          fill="none" stroke="#A3C79E" stroke-width="1.2" stroke-linecap="round" opacity="0.65" />

    <!-- THE GOLD SWOOSH & ORBIT (Trade - Weaves across A and encircles Globe) -->
    <!-- Lower Tail of Swoosh -->
    <path d="M 32 152 C 26 158 24 166 28 171 C 33 175 42 176 56 172 C 78 166 98 152 116 136 C 132 122 146 114 162 114 C 182 114 198 126 198 140 C 198 144 196 148 191 148 C 186 148 184 144 184 140 C 184 132 174 124 160 124 C 142 124 126 134 108 148 C 88 164 66 178 44 180 C 30 181 20 176 16 166 C 13 158 16 148 24 142 C 27 140 30 142 32 152 Z" 
          fill="url(#gold-grad)" />

    <!-- Main Crossbar & Ascent to Globe -->
    <path d="M 38 168 C 62 162 88 144 114 126 C 134 112 152 104 168 104 C 188 104 204 116 204 128 C 204 133 200 137 195 137 C 190 137 188 132 186 128 C 182 118 172 112 158 112 C 140 112 120 124 98 142 C 74 160 52 174 38 168 Z" 
          fill="url(#gold-bright)" opacity="0.85" />

    <!-- Orbital Loop Ring around Globe -->
    <path d="M 124 116 C 146 98 174 92 194 98 C 208 102 216 112 214 122 C 211 134 198 142 182 142 C 166 142 152 134 144 124 C 141 120 144 116 148 118 C 156 126 168 134 182 134 C 196 134 206 126 208 118 C 210 110 202 102 190 98 C 172 92 146 98 126 114 Z" 
          fill="url(#gold-grad)" />

    <!-- THE GOLD GLOBE (Global) -->
    <g transform="translate(168, 68)">
      <!-- Outer globe sphere rim -->
      <circle cx="0" cy="0" r="28" fill="none" stroke="url(#gold-grad)" stroke-width="2" stroke-opacity="0.4" />
      
      <!-- Globe Base Fill -->
      <circle cx="0" cy="0" r="26" fill="url(#gold-grad)" opacity="0.22" />

      <!-- Latitudes / Longitudes -->
      <ellipse cx="0" cy="0" rx="26" ry="12" fill="none" stroke="url(#gold-bright)" stroke-width="1.2" stroke-opacity="0.45" />
      <ellipse cx="0" cy="0" rx="14" ry="26" fill="none" stroke="url(#gold-bright)" stroke-width="1.2" stroke-opacity="0.45" />
      <line x1="-26" y1="0" x2="26" y2="0" stroke="url(#gold-bright)" stroke-width="1.2" stroke-opacity="0.45" />
      <line x1="0" y1="-26" x2="0" y2="26" stroke="url(#gold-bright)" stroke-width="1.2" stroke-opacity="0.45" />

      <!-- Stylized Continent Silhouette / India & Eurasia highlight -->
      <path d="M -8 -12 C -2 -14 6 -16 14 -10 C 18 -6 20 0 16 8 C 12 12 4 15 -4 14 C -12 12 -16 4 -14 -4 Z" 
            fill="url(#gold-bright)" opacity="0.65" />
      <circle cx="4" cy="-2" r="3" fill="#FFF" opacity="0.9" />
    </g>

    <!-- THE COMPASS STAR (Opportunity - Top Right of Globe) -->
    <g transform="translate(196, 60)">
      <!-- 4 Primary Long Diamond Points -->
      <path d="M 0 -18 L 3 -4 L 18 0 L 3 4 L 0 18 L -3 4 L -18 0 L -3 -4 Z" fill="url(#gold-bright)" />
      <!-- 4 Diagonal Secondary Points -->
      <path d="M 0 -9 L 2 -2 L 9 0 L 2 2 L 0 9 L -2 2 L -9 0 L -2 -2 Z" fill="#FFFFFF" opacity="0.8" />
      <!-- Star Core Glint -->
      <circle cx="0" cy="0" r="2.2" fill="#FFFFFF" />
    </g>
  </g>
</svg>
